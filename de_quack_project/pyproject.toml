[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "de_quack"
version = "2.0.0"
description = "Python library for differential expression data storage and visualization using DuckDB."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["duckdb", "differential expression", "bioinformatics", "visualization", "data management", "rnaseq"]
authors = [
  { name = "yangp7833-commits" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]

dependencies = [
  "duckdb>=1.0",
  "polars>=1.0",
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
de_quack = ["gene_tables/*.parquet"]

[tool.setuptools]
include-package-data = true


